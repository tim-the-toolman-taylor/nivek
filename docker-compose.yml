services:
  postgres:
    image: postgres:16
    pull_policy: always
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USERNAME}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - nivek-internal
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  core-api:
    build:
      dockerfile: docker/images/go/Dockerfile.core-api.prod
      pull: true
    init: true
    environment:
      APP_NAME: ${APP_NAME}
      CORE_API_PORT: ${CORE_API_PORT:-8080}
      CORE_API_LISTEN_ADDRESS: ${CORE_API_LISTEN_ADDRESS:-0.0.0.0}
      POSTGRES_USERNAME: ${POSTGRES_USERNAME}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: 5432
      POSTGRES_SSL_MODE: ${POSTGRES_SSL_MODE:-disable}
      WINDY_API_TOKEN: ${WINDY_API_TOKEN}
      IP_INFO_API_TOKEN: ${IP_INFO_API_TOKEN}
      TWITCH_API_TOKEN: ${TWITCH_API_TOKEN:-}
      JWT_SECRET: ${JWT_SECRET}
      TWITCH_CLIENT_ID: ${TWITCH_CLIENT_ID}
      TWITCH_CLIENT_SECRET: ${TWITCH_CLIENT_SECRET}
      TWITCH_REDIRECT_URI: ${TWITCH_REDIRECT_URI}
      TWITCH_EVENTSUB_SECRET: ${TWITCH_EVENTSUB_SECRET:-}
      TWITCH_EVENTSUB_CALLBACK_URL: ${TWITCH_EVENTSUB_CALLBACK_URL:-}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
      SESSION_COOKIE_DOMAIN: ${SESSION_COOKIE_DOMAIN:-}
      SESSION_TTL_MINUTES: ${SESSION_TTL_MINUTES:-480}
      DASHBOARD_PUSH_HMAC_KEY: ${DASHBOARD_PUSH_HMAC_KEY}
      BOT_API_HMAC_KEY: ${BOT_API_HMAC_KEY}
      BOT_INTERNAL_URL: ${BOT_INTERNAL_URL:-http://172.19.0.1:8090}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - nivek-internal
      - gateway
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8080/api/healthz >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s
    labels:
      - traefik.enable=true
      - traefik.http.routers.nivek.rule=Host(`peanutbudderbot.com`) && PathPrefix(`/api`)
      - traefik.http.routers.nivek.entrypoints=websecure
      - traefik.http.routers.nivek.tls.certresolver=letsencrypt
      - traefik.http.services.nivek.loadbalancer.server.port=8080

  web:
    build:
      dockerfile: docker/images/nuxt/Dockerfile.prod
      pull: true
    init: true
    networks:
      - gateway
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3000/ >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s
    labels:
      - traefik.enable=true
      - traefik.http.routers.nivek-web.rule=Host(`peanutbudderbot.com`)
      - traefik.http.routers.nivek-web.entrypoints=websecure
      - traefik.http.routers.nivek-web.tls.certresolver=letsencrypt
      - traefik.http.services.nivek-web.loadbalancer.server.port=3000

volumes:
  postgres_data:
    name: postgres_data

networks:
  nivek-internal:
    driver: bridge
  gateway:
    external: true
