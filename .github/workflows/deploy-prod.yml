name: Prod Service Deployment

on:
  push:
    branches:
      - main
    # Optional: limit triggers to certain paths if you want
    # paths:
    #   - 'cmd/core-api/**'
    #   - 'internal/**'
    #   - 'pkg/**'
    #   - 'go.mod'
    #   - 'go.sum'

permissions:
  contents: write

jobs:
  pull:
    runs-on: [self-hosted, linux, prod]  # Vultr runner labels

    steps:
      - name: Checkout repository (default workspace)
        uses: actions/checkout@v4

      - name: List pulled files (sanity check)
        run: |
          echo "Repository pulled to runner workspace"
          pwd
          ls -la
  deploy:
    needs: pull
    runs-on: [self-hosted, linux, prod]

    steps:
      # Stamp the short commit SHA into the Nuxt bundle so the footer build
      # tag reflects what was actually deployed. Overwrites the committed
      # 'dev' placeholder before env-setup.sh kicks off the docker build.
      - name: Stamp build version
        run: |
          SHA=$(git rev-parse --short HEAD)
          cat > nivek-nuxt/app/utils/version.ts <<EOF
          export const BUILD_VERSION = '${SHA}'
          EOF

      - name: Env Setup
        run: /home/deploy/actions-runner/env-setup.sh

      # Rebuild the twitch-bot host-daemon binary. git clean (-x) wipes the
      # gitignored bin/ on every deploy, so without this the binary would be
      # missing until manually rebuilt — a running bot survives the delete
      # (Linux keeps the open inode) but the NEXT restart would fail to find it.
      # Building here does not restart the daemon; that stays a manual step so
      # the bot is only bounced intentionally.
      - name: Build twitch-bot binary
        run: /usr/local/go/bin/go build -o bin/twitch-bot ./cmd/twitch-bot
